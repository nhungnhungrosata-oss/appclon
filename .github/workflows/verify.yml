name: Verify deployment
on:
  push:
    branches: [main, fix/restore-vercel-deployment]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build and validate source
        run: npm run build
      - name: Test
        run: npm test
      - name: Capture source for diagnosis
        if: always()
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 1
