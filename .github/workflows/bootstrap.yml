name: Bootstrap original ClipLab source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract only when archive is complete
        shell: bash
        run: |
          set -euo pipefail
          [ -f bootstrap/READY ] || exit 0
          count=$(find bootstrap -maxdepth 1 -name 'chunk-*.b64' | wc -l | tr -d ' ')
          [ "$count" = "19" ] || { echo "Waiting for 38 archive chunks; found $count"; exit 0; }
          mkdir -p /tmp/cliplab-upload
          cat bootstrap/chunk-*.b64 > /tmp/cliplab-upload/source.zip.b64
          base64 -d /tmp/cliplab-upload/source.zip.b64 > /tmp/cliplab-upload/source.zip
          echo "6e57ad34f684820e26e86aa068d97cb1ae48b58cf3515ebd0bc6fe59d0203d85  /tmp/cliplab-upload/source.zip" | sha256sum -c -
          unzip -q /tmp/cliplab-upload/source.zip -d /tmp/cliplab-upload/unpacked
          test -f /tmp/cliplab-upload/unpacked/creator-studio/package.json
          test -f /tmp/cliplab-upload/unpacked/creator-studio/public/app.js
          test -f /tmp/cliplab-upload/unpacked/creator-studio/api/index.js
          rsync -a /tmp/cliplab-upload/unpacked/creator-studio/ ./ --exclude '.env.local'
          rm -rf bootstrap /tmp/cliplab-upload
          rm -f .github/workflows/bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import original ClipLab source from v1.1 ZIP"
          git push